<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universidad Continental | Elite Edition</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white">

    <nav class="navbar navbar-expand-lg sticky-top main-nav">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="index.html">
                UC <span class="text-purple">CONTINENTAL</span>
            </a>
            <button class="navbar-toggler border-purple" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fas fa-bars text-white"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="carreras.html">Carreras</a></li>
                    <li class="nav-item ms-lg-3">
                        <button class="btn btn-uc-purple px-4 rounded-pill" data-bs-toggle="modal" data-bs-target="#modalPostula">
                            POSTULA YA
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero-header d-flex align-items-center">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <h1 class="display-1 fw-black mb-4">REDEFINE TU <br><span class="text-purple">FUTURO</span></h1>
                    <p class="lead mb-5 opacity-75">Innovación tecnológica y mentalidad emprendedora en la universidad con mayor proyección del país.</p>
                    <div class="d-flex gap-3">
                        <button class="btn btn-uc-purple btn-lg px-5" data-bs-toggle="modal" data-bs-target="#modalPostula">ADMISIÓN 2026</button>
                        <a href="carreras.html" class="btn btn-outline-light btn-lg rounded-pill px-5">CARRERAS</a>
                    </div>
                </div>
                <div class="col-lg-6 d-none d-lg-block">
                    <div class="hero-img-container shadow-glow">
                        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800&q=80" alt="Estudiantes UC" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="modal fade" id="modalPostula" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-purple">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold">Postulación <span class="text-purple">Continental</span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formPostulacion">
                        <div class="mb-3">
                            <label class="form-label small opacity-75">Nombres Completos</label>
                            <input type="text" class="form-control bg-black text-white border-secondary" required placeholder="Ej. Juan Pérez">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small opacity-75">Modalidad</label>
                            <select class="form-select bg-black text-white border-secondary" required>
                                <option value="" selected disabled>Selecciona modalidad</option>
                                <option>Presencial</option>
                                <option>Semipresencial</option>
                                <option>A Distancia (Virtual)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small opacity-75">Carrera de Interés</label>
                            <select class="form-select bg-black text-white border-secondary" required>
                                <option value="" selected disabled>Selecciona carrera</option>
                                <optgroup label="Ingenierías">
                                    <option>Ingeniería de Sistemas</option>
                                    <option>Ingeniería Industrial</option>
                                    <option>Ingeniería Civil</option>
                                </optgroup>
                                <optgroup label="Salud">
                                    <option>Medicina Humana</option>
                                    <option>Psicología</option>
                                </optgroup>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-uc-purple w-100 mt-3">ENVIAR SOLICITUD</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="java.js"></script>
</body>
</html>
